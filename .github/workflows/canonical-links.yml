name: Canonical Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: canonical-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify canonical reader links
        run: bash scripts/verify-canonical-links.sh
