name: Dart Companion CI

on:
  push:
    branches: [main]
    paths:
      - 'parts/**'
      - 'examples/**'
      - 'exercises/**'
      - 'solutions/**'
      - 'master-projects/**'
      - 'interview-preparation/**'
      - 'scripts/validate-companion-packages.sh'
      - 'scripts/list-companion-packages.sh'
      - '.github/workflows/dart-companion.yml'
  pull_request:
    branches: [main]
    paths:
      - 'parts/**'
      - 'examples/**'
      - 'exercises/**'
      - 'solutions/**'
      - 'master-projects/**'
      - 'interview-preparation/**'
      - 'scripts/validate-companion-packages.sh'
      - 'scripts/list-companion-packages.sh'
      - '.github/workflows/dart-companion.yml'

concurrency:
  group: dart-companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_KIND: dart
  REQUIRE_MATCH: '1'

jobs:
  validate-dart-companions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Show Dart version
        run: dart --version

      - name: Validate pure-Dart companion packages
        run: bash scripts/validate-companion-packages.sh
